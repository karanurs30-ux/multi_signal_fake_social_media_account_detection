<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueCheck — Login & Signup</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --white: #f5f5f0;
            --green: #1db954;
            --green-dark: #169c44;
            --pink: #f4c2d0;
            --blue: #b8d4f0;
            --yellow: #f5e46a;
            --red-card: #f2a49a;
            --gray: #e8e8e3;
            --gray-dark: #888880;
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--white);
            color: var(--black);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        /* ── AUTH CONTAINER ── */
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border: 3px solid var(--black);
            border-radius: 24px;
            box-shadow: 10px 10px 0px var(--black);
            padding: 40px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-container:hover {
            transform: translate(-2px, -2px);
            box-shadow: 12px 12px 0px var(--black);
        }

        /* ── BRANDING ── */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.5px;
            margin-bottom: 32px;
            justify-content: center;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: var(--black);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 18px;
        }

        /* ── TAB TOGGLE ── */
        .tabs {
            display: flex;
            background: var(--gray);
            border-radius: 100px;
            padding: 4px;
            margin-bottom: 32px;
            border: 1.5px solid rgba(0, 0, 0, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 100px;
            border: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--gray-dark);
            text-align: center;
        }

        .tab-btn.active {
            background: var(--black);
            color: var(--white);
        }

        /* ── FORMS ── */
        .form-pane {
            display: none;
        }

        .form-pane.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--black);
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--black);
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 500;
            background: white;
            outline: none;
            transition: all 0.2s;
            color: var(--black);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        input:focus {
            box-shadow: 4px 4px 0px var(--black);
            transform: translate(-2px, -2px);
            border-color: var(--black);
        }

        /* ── BUTTONS ── */
        .btn-submit {
            width: 100%;
            background: var(--green);
            color: var(--black);
            border: 2px solid var(--black);
            padding: 16px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 4px 4px 0px var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--green-dark);
            color: white;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--black);
        }

        .btn-submit:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--black);
        }

        /* ── ALERTS ── */
        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            border: 2px solid var(--black);
            display: none;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.error {
            background: var(--red-card);
            color: #5a140d;
        }

        .alert.success {
            background: var(--blue);
            color: #123456;
        }

        /* ── FOOTER DECORATION ── */
        .auth-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 13px;
            color: var(--gray-dark);
        }

        .auth-footer a {
            color: var(--black);
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main class="auth-container" id="auth-box">
        <div class="brand">
            <div class="brand-icon">🔍</div>
            <span>TrueCheck</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Sign Up</button>
        </div>

        <!-- Notification Banner -->
        <div id="auth-alert" class="alert"></div>

        <!-- Login Form -->
        <div id="pane-login" class="form-pane active">
            <h2>Welcome back</h2>
            <p style="color: var(--gray-dark); font-size: 14px; margin-bottom: 24px;">Enter your credentials to access the account validator dashboard.</p>
            <form id="form-login" onsubmit="handleAuth(event, '/login')">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" placeholder="e.g. admin" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-login-submit">
                    <span>Log In</span>
                    <span style="font-size: 18px;">→</span>
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="pane-register" class="form-pane">
            <h2>Create account</h2>
            <p style="color: var(--gray-dark); font-size: 14px; margin-bottom: 24px;">Set up a new access profile for TrueCheck analysis dashboard.</p>
            <form id="form-register" onsubmit="handleAuth(event, '/register')">
                <div class="form-group">
                    <label for="register-username">Choose Username</label>
                    <input type="text" id="register-username" name="username" placeholder="e.g. analyzer_pro" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Create Password</label>
                    <input type="password" id="register-password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-register-submit">
                    <span>Sign Up</span>
                    <span style="font-size: 18px;">→</span>
                </button>
            </form>
        </div>

        <div class="auth-footer" id="footer-text">
            Don't have an account? <a onclick="switchTab('register')">Sign Up</a>
        </div>
    </main>

    <script>
        function switchTab(mode) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const loginPane = document.getElementById('pane-login');
            const registerPane = document.getElementById('pane-register');
            const footerText = document.getElementById('footer-text');
            const alertBox = document.getElementById('auth-alert');

            // Hide alert box on switch
            alertBox.style.display = 'none';

            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginPane.classList.add('active');
                registerPane.classList.remove('active');
                footerText.innerHTML = `Don't have an account? <a onclick="switchTab('register')">Sign Up</a>`;
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerPane.classList.add('active');
                loginPane.classList.remove('active');
                footerText.innerHTML = `Already have an account? <a onclick="switchTab('login')">Log In</a>`;
            }
        }

        async function handleAuth(event, endpoint) {
            event.preventDefault();
            const alertBox = document.getElementById('auth-alert');
            alertBox.style.display = 'none';

            const form = event.target;
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalBtnHtml = submitBtn.innerHTML;

            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Processing...</span>`;

            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;

                if (!response.ok || result.error) {
                    alertBox.className = 'alert error';
                    alertBox.textContent = '⚠️ ' + (result.error || 'Authentication failed');
                    alertBox.style.display = 'block';
                } else {
                    if (endpoint === '/register') {
                        // Registration success
                        alertBox.className = 'alert success';
                        alertBox.textContent = '✅ Registration successful! Please log in.';
                        alertBox.style.display = 'block';
                        form.reset();
                        setTimeout(() => switchTab('login'), 1500);
                    } else {
                        // Login success, redirect to dashboard
                        alertBox.className = 'alert success';
                        alertBox.textContent = '✅ Logged in successfully! Redirecting...';
                        alertBox.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 800);
                    }
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
                alertBox.className = 'alert error';
                alertBox.textContent = '⚠️ Network error. Please try again.';
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>

</html>
